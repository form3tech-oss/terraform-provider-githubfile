name: CI

on: 
  pull_request:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_ACC: 1
  TERRAFORM_VERSION: "1.11.1"
  COMMIT_MESSAGE_PREFIX: "[skip ci]"
  GITHUB_TOKEN: ${{ github.token }}
  GITHUB_USERNAME: "github-actions[bot]"
  GITHUB_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: 'go.mod'
          cache: true
          
      - name: Set up Terraform
        run: |
          set -euo pipefail
          base="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}"
          zip="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"

          curl -sSfL "${base}/${zip}" -o "${zip}"
          curl -sSfL "${base}/terraform_${TERRAFORM_VERSION}_SHA256SUMS" -o SHA256SUMS

          grep " ${zip}\$" SHA256SUMS | sha256sum --check --status

          sudo unzip -o -q "${zip}" terraform -d /usr/local/bin
          rm -f "${zip}" SHA256SUMS

          terraform version

      - name: Tests
        run: |
          make test
